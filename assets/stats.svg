<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FilePrism в цифрах</title>
  <desc id="desc">67 пар форматов, 18 гайдов, 23 хаба, 243 страницы. Изображения обрабатываются в браузере, остальное на сервере.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset="0.55" stop-color="#0D1734"/>
      <stop offset="1" stop-color="#0A1024"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <clipPath id="split">
      <rect x="880" y="520" width="600" height="36" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#8B9CFF" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600M0 700H1600M0 800H1600"/>
    <path d="M100 0V900M300 0V900M500 0V900M700 0V900M900 0V900M1100 0V900M1300 0V900M1500 0V900"/>
  </g>

  <text x="60" y="58" fill="#F5F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">FilePrism в цифрах</text>
  <text x="60" y="88" fill="#7F8FB8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Что уже работает: форматы, контент, страницы и разделение обработки.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="120" width="355" height="150" rx="20" fill="#111A38" stroke="#2A3A6B"/>
    <text x="88" y="195" fill="#F5F7FF" font-size="48" font-weight="700">67</text>
    <text x="88" y="232" fill="#8FA0C8" font-size="14">пар форматов</text>
    <rect x="435" y="120" width="355" height="150" rx="20" fill="#111A38" stroke="#2A3A6B"/>
    <text x="463" y="195" fill="#F5F7FF" font-size="48" font-weight="700">18</text>
    <text x="463" y="232" fill="#8FA0C8" font-size="14">гайдов на RU и EN</text>
    <rect x="810" y="120" width="355" height="150" rx="20" fill="#111A38" stroke="#2A3A6B"/>
    <text x="838" y="195" fill="#F5F7FF" font-size="48" font-weight="700">23</text>
    <text x="838" y="232" fill="#8FA0C8" font-size="14">хаба форматов</text>
    <rect x="1185" y="120" width="355" height="150" rx="20" fill="#111A38" stroke="#2A3A6B"/>
    <text x="1213" y="195" fill="#F5F7FF" font-size="48" font-weight="700">243</text>
    <text x="1213" y="232" fill="#8FA0C8" font-size="14">статические страницы</text>
  </g>

  <text x="60" y="360" fill="#F5F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Форматы по категориям</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="60" y="430" fill="#A9B7E8" font-size="15">Изображения</text>
    <rect x="300" y="410" width="404" height="28" rx="14" fill="url(#violet)"/>
    <text x="720" y="430" fill="#C7D2FE" font-size="15" font-weight="600">26</text>

    <text x="60" y="500" fill="#A9B7E8" font-size="15">Видео и аудио</text>
    <rect x="300" y="480" width="420" height="28" rx="14" fill="url(#blue)"/>
    <text x="736" y="500" fill="#BFDBFE" font-size="15" font-weight="600">27</text>

    <text x="60" y="570" fill="#A9B7E8" font-size="15">Документы</text>
    <rect x="300" y="550" width="218" height="28" rx="14" fill="url(#pink)"/>
    <text x="534" y="570" fill="#FBCFE8" font-size="15" font-weight="600">14</text>
  </g>

  <text x="820" y="360" fill="#F5F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Где обрабатывается</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="880" y="450" fill="#F5F7FF" font-size="56" font-weight="700">26</text>
    <text x="880" y="482" fill="#A9B7E8" font-size="14">в браузере</text>
    <text x="1180" y="450" fill="#F5F7FF" font-size="56" font-weight="700">41</text>
    <text x="1180" y="482" fill="#A9B7E8" font-size="14">на сервере</text>

    <g clip-path="url(#split)">
      <rect x="880" y="520" width="234" height="36" fill="#8B5CF6"/>
      <rect x="1114" y="520" width="366" height="36" fill="#3B82F6"/>
    </g>
    <text x="880" y="590" fill="#A78BFA" font-size="14">39% — браузер</text>
    <text x="1480" y="590" fill="#67E8F9" font-size="14" text-anchor="end">61% — сервер</text>

    <text x="880" y="640" fill="#7F8FB8" font-size="14">Картинки не покидают устройство, когда браузер справляется сам.</text>
    <text x="880" y="666" fill="#7F8FB8" font-size="14">Видео, аудио и документы идут через очередь и воркер.</text>
  </g>

  <text x="60" y="840" fill="#6F7DA8" font-family="Segoe UI, Arial, sans-serif" font-size="14">FilePrism · 67 пар · 18 гайдов · 23 хаба · 243 страницы · RU / EN</text>
</svg>

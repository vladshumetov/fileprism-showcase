<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FilePrism architecture</title>
  <desc id="desc">Images convert in the browser. Video, audio and documents go through nginx, Next.js, Redis and a worker with FFmpeg, LibreOffice, Poppler, sharp and pdf2docx.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080D1C"/>
      <stop offset="1" stop-color="#0B1228"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L6 3L0 6Z" fill="#5B6C9E"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L6 3L0 6Z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <text x="56" y="52" fill="#F5F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">How FilePrism works</text>
  <text x="56" y="80" fill="#8FA0C8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Privacy-first hybrid conversion: images never leave the browser, everything else runs in an isolated server queue.</text>

  <!-- ===== Browser column ===== -->
  <rect x="56" y="112" width="360" height="208" rx="20" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-opacity="0.45"/>
  <text x="80" y="146" fill="#D8CCFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Browser</text>

  <rect x="76" y="162" width="320" height="60" rx="12" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.30"/>
  <text x="94" y="186" fill="#EDE9FE" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Images</text>
  <text x="94" y="206" fill="#B9A7F5" font-family="Segoe UI, Arial, sans-serif" font-size="12">Canvas · WebCodecs · heic2any</text>

  <rect x="76" y="238" width="320" height="58" rx="12" fill="#3B82F6" fill-opacity="0.13" stroke="#3B82F6" stroke-opacity="0.30"/>
  <text x="94" y="262" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Video · audio · documents</text>
  <text x="94" y="282" fill="#93B4E8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Uploaded to the server</text>

  <rect x="56" y="350" width="360" height="70" rx="16" fill="#22C55E" fill-opacity="0.08" stroke="#22C55E" stroke-opacity="0.35"/>
  <text x="80" y="378" fill="#BBF7D0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Local download</text>
  <text x="80" y="400" fill="#7FD99A" font-family="Segoe UI, Arial, sans-serif" font-size="12">No upload for images</text>

  <rect x="56" y="470" width="360" height="150" rx="20" fill="#EC4899" fill-opacity="0.07" stroke="#EC4899" stroke-opacity="0.35"/>
  <text x="80" y="504" fill="#FBCFE8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Ads, consent, analytics</text>
  <text x="80" y="530" fill="#D8A0C4" font-family="Segoe UI, Arial, sans-serif" font-size="13">AdSense · Yandex RSYA</text>
  <text x="80" y="552" fill="#D8A0C4" font-family="Segoe UI, Arial, sans-serif" font-size="13">Consent-gated ad scripts</text>
  <text x="80" y="574" fill="#D8A0C4" font-family="Segoe UI, Arial, sans-serif" font-size="13">Yandex Metrica · GA4</text>

  <!-- ===== Server column ===== -->
  <rect x="480" y="150" width="170" height="100" rx="16" fill="#3B82F6" fill-opacity="0.09" stroke="#3B82F6" stroke-opacity="0.40"/>
  <text x="500" y="180" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">nginx</text>
  <text x="500" y="204" fill="#93B4E8" font-family="Segoe UI, Arial, sans-serif" font-size="12">TLS · 120 MB</text>
  <text x="500" y="224" fill="#93B4E8" font-family="Segoe UI, Arial, sans-serif" font-size="12">/healthz</text>

  <rect x="700" y="150" width="230" height="100" rx="16" fill="#3B82F6" fill-opacity="0.09" stroke="#3B82F6" stroke-opacity="0.40"/>
  <text x="720" y="180" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Next.js web</text>
  <text x="720" y="204" fill="#93B4E8" font-family="Segoe UI, Arial, sans-serif" font-size="12">API · jobs · download</text>
  <text x="720" y="224" fill="#93B4E8" font-family="Segoe UI, Arial, sans-serif" font-size="12">SSG · SEO · i18n</text>

  <rect x="980" y="150" width="240" height="100" rx="16" fill="#F59E0B" fill-opacity="0.09" stroke="#F59E0B" stroke-opacity="0.40"/>
  <text x="1000" y="180" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Redis + BullMQ</text>
  <text x="1000" y="204" fill="#D8B96A" font-family="Segoe UI, Arial, sans-serif" font-size="12">queue · rate limit</text>
  <text x="1000" y="224" fill="#D8B96A" font-family="Segoe UI, Arial, sans-serif" font-size="12">concurrency 1</text>

  <rect x="480" y="350" width="170" height="120" rx="16" fill="#06B6D4" fill-opacity="0.09" stroke="#06B6D4" stroke-opacity="0.40"/>
  <text x="500" y="380" fill="#A5F3FC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Storage</text>
  <text x="500" y="404" fill="#7DD3E8" font-family="Segoe UI, Arial, sans-serif" font-size="12">uploads volume</text>
  <text x="500" y="424" fill="#7DD3E8" font-family="Segoe UI, Arial, sans-serif" font-size="12">TTL 60 min</text>

  <!-- ===== Worker ===== -->
  <rect x="700" y="290" width="520" height="320" rx="20" fill="#F97316" fill-opacity="0.07" stroke="#F97316" stroke-opacity="0.35"/>
  <text x="724" y="324" fill="#FED7AA" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Worker</text>
  <text x="840" y="324" fill="#D89A62" font-family="Segoe UI, Arial, sans-serif" font-size="12">one job at a time · isolated queue</text>

  <rect x="724" y="342" width="230" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <text x="740" y="368" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">FFmpeg</text>
  <text x="740" y="390" fill="#C9B07A" font-family="Segoe UI, Arial, sans-serif" font-size="11">video · audio · GIF</text>

  <rect x="968" y="342" width="228" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <text x="984" y="368" fill="#BFDBFE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">LibreOffice</text>
  <text x="984" y="390" fill="#8FA8C8" font-family="Segoe UI, Arial, sans-serif" font-size="11">DOCX · XLSX · PPTX</text>

  <rect x="724" y="424" width="230" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <text x="740" y="450" fill="#A5F3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Poppler</text>
  <text x="740" y="472" fill="#7DD3E8" font-family="Segoe UI, Arial, sans-serif" font-size="11">PDF → JPG/PNG/HTML/TXT</text>

  <rect x="968" y="424" width="228" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <text x="984" y="450" fill="#DDD6FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">sharp</text>
  <text x="984" y="472" fill="#A99BE0" font-family="Segoe UI, Arial, sans-serif" font-size="11">images · ICO · TIFF · AVIF</text>

  <rect x="724" y="506" width="472" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <text x="740" y="532" fill="#FBCFE8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">pdf2docx</text>
  <text x="740" y="554" fill="#D8A0C4" font-family="Segoe UI, Arial, sans-serif" font-size="11">PDF → editable DOCX</text>

  <!-- ===== Arrows ===== -->
  <g fill="none" stroke="#5B6C9E" stroke-width="2" marker-end="url(#arrow)">
    <path d="M396 266 C430 266 450 222 480 210"/>
    <path d="M650 200 H700"/>
    <path d="M930 200 H980"/>
    <path d="M1100 250 V290"/>
    <path d="M700 430 H650"/>
    <path d="M650 360 C690 342 720 300 760 262"/>
    <path d="M700 250 C560 300 470 320 416 365" stroke-dasharray="6 6" marker-end="url(#arrowDashed)"/>
    <path d="M96 222 C64 250 64 320 96 350" stroke="#8B5CF6" stroke-dasharray="6 6" marker-end="url(#arrowDashed)"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7F8FB8">
    <text x="418" y="246">upload</text>
    <text x="664" y="192">proxy</text>
    <text x="942" y="192">enqueue</text>
    <text x="1112" y="274">jobs</text>
    <text x="658" y="418">result</text>
    <text x="690" y="330">serve</text>
    <text x="500" y="340">download</text>
    <text x="106" y="338" fill="#A78BFA">local, no upload</text>
  </g>

  <!-- ===== Legend ===== -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8FA0C8">
    <rect x="56" y="660" width="12" height="12" rx="3" fill="#8B5CF6"/>
    <text x="76" y="670">Browser</text>
    <rect x="160" y="660" width="12" height="12" rx="3" fill="#3B82F6"/>
    <text x="180" y="670">Server</text>
    <rect x="254" y="660" width="12" height="12" rx="3" fill="#F59E0B"/>
    <text x="274" y="670">Queue</text>
    <rect x="344" y="660" width="12" height="12" rx="3" fill="#06B6D4"/>
    <text x="364" y="670">Storage</text>
    <rect x="444" y="660" width="12" height="12" rx="3" fill="#F97316"/>
    <text x="464" y="670">Worker tools</text>
    <rect x="574" y="660" width="12" height="12" rx="3" fill="#EC4899"/>
    <text x="594" y="670">Ads / consent</text>
  </g>
</svg>
